{% extends 'en/layout2.html' %}

{% block title %}
    Home
{% endblock %}

{% block main %}
    <section class="main-content">
        <h2>Iconic creatures</h2>

        {% for creature in creatures %}
            <div class="animals">
                <h3>{{ creature["species"] }}</h3>
                <p><i>{{ creature["scientific_name"] }}</i></p>
                <img src="{{ url_for('static', filename=creature['photo']) }}" alt="{{ creature['alt_text_en'] }}" /><br />
                <a href="{{ url_for('creature_info_en', creature_id=creature['id']) }}">Learn more ←</a>
            </div>
        {% endfor %}
    </section>

{% endblock %}
